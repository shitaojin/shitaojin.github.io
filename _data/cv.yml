  sections:
    Profile:
      - bullet: "PhD candidate in Architecture at Tongji University and visiting PhD researcher at The University of Melbourne, working across architectural programming, collective intelligence, megaproject governance, and AI-supported design education."
      - bullet: "Author of 22 published papers, including 20 peer-reviewed journal articles and 2 published conference papers."
      - bullet: "Research record includes 16 first- or corresponding-author peer-reviewed journal articles, 320 Google Scholar citations, h-index / i10-index of 8 / 7, and 183 verified peer reviews."
      - bullet: "Open to academic, postdoctoral, and research-oriented opportunities in intelligent construction, innovative management, smart cities, and AI-enabled built-environment research."

    Research Themes:
      - bullet: >-
          <strong>AI-enabled architectural programming and collective-intelligence decision-making.</strong> Treats architectural programming as a front-end decision system for problem definition, value clarification, stakeholder alignment, and evidence-based evaluation; develops group decision-making and multi-agent reinforcement learning frameworks for mega transportation projects and public infrastructure programming.
      - bullet: >-
          <strong>Megaproject governance, complexity, risk, and public concerns.</strong> Builds computational evidence for megaproject risk, complexity, stakeholder networks, and dynamic public concerns by integrating topic modeling, sentiment analysis, SNA, MCDM, gray fuzzy group decision-making, Monte Carlo simulation, and systematic review.
      - bullet: >-
          <strong>Child-friendly communities and urban renewal.</strong> Translates children's well-being, public perception, and inclusive planning values into community renewal and street-design evidence through street-view imagery, questionnaires, online reviews, AI perception models, and value-based programming.
      - bullet: >-
          <strong>Higher-education learning environment evaluation.</strong> Uses post-occupancy evaluation, survey analysis, and spatial-factor modeling to study classrooms, active learning spaces, academic libraries, and campus learning environments.
      - bullet: >-
          <strong>AI-assisted architectural teaching research.</strong> Studies AI as a teaching medium for architectural programming, problem seeking, design generation, evaluation, and design responsibility, with a published AI-assisted course model in <em>Buildings</em>.

