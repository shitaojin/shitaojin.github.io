  sections:
    Profile:
      - name: Academic snapshot
        summary: 22 published papers, including 20 peer-reviewed journal articles and 2 published conference papers. My publication record includes 16 first- or corresponding-author peer-reviewed journal articles, 298 Google Scholar citations, h-index / i10-index of 8 / 7, and 169 verified peer reviews.
        highlights:
          - AI-enabled architectural programming and collective-intelligence decision-making.
          - Megaproject governance, public concerns, stakeholder coordination, complexity, and risk.
          - Child-friendly communities, urban renewal, and human well-being in the built environment.
          - Higher-education learning environments and AI-supported architectural teaching.

    Research Clusters:
      - name: AI-enabled architectural programming and collective-intelligence decision-making
        summary: Treats architectural programming as a front-end decision system for problem definition, value clarification, stakeholder alignment, and evidence-based evaluation.
        highlights:
          - Develops group decision-making and multi-agent reinforcement learning frameworks for mega transportation projects and public infrastructure programming.
          - Representative outputs include the ECAM group decision-making model, CAADRIA multi-agent reinforcement learning paper, and AEDM review of collective intelligence in construction.
          - Grant-ready direction: AI-supported briefing platforms integrating expert judgment, public needs, and adaptive optimization.

      - name: Megaproject governance, complexity, and stakeholder coordination
        summary: Builds computational evidence for megaproject risk, complexity, stakeholder networks, and dynamic public concerns.
        highlights:
          - Integrates social network analysis, multi-criteria decision-making, gray fuzzy group decision-making, Monte Carlo simulation, topic modeling, sentiment analysis, and systematic review.
          - Representative outputs include JCEM public concern dynamics, JAE risk assessment, ECAM complexity measurement, and ECAM stakeholder identification papers.
          - Grant-ready direction: transparent and stakeholder-responsive infrastructure governance toolkits.

      - name: Human-centered and value-based built-environment evaluation
        summary: Extends architectural programming from buildings to communities, streets, learning environments, and child-friendly public spaces.
        highlights:
          - Uses street-view imagery, questionnaire data, public reviews, AI perception models, and post-occupancy evaluation.
          - Representative outputs include FoAR value-based programming for children's well-being, FoAR neighborhood center public perception analysis, and learning-environment studies.
          - Grant-ready direction: human-centered AI for community renewal, social infrastructure, and learning-space evaluation.

