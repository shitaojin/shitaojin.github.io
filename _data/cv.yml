  sections:
    Profile:
      - bullet: "PhD candidate in Architecture at Tongji University and visiting PhD researcher at The University of Melbourne, working across architectural programming, collective intelligence, megaproject governance, and AI-supported design education."
      - bullet: "Author of 22 published papers, including 20 peer-reviewed journal articles and 2 published conference papers."
      - bullet: "Research record includes 16 first- or corresponding-author peer-reviewed journal articles, 298 Google Scholar citations, h-index / i10-index of 8 / 7, and 164 verified peer reviews."
      - bullet: "Open to academic, postdoctoral, and research-oriented opportunities in intelligent construction, innovative management, smart cities, and AI-enabled built-environment research."

    Research Themes:
      - name: AI-enabled architectural programming and collective-intelligence decision-making
        summary: Treats architectural programming as a front-end decision system for problem definition, value clarification, stakeholder alignment, and evidence-based evaluation.
        highlights:
          - Develops group decision-making and multi-agent reinforcement learning frameworks for mega transportation projects and public infrastructure programming.
          - Connects architectural programming theory with collective intelligence, value management, stakeholder coordination, and AI optimization.
          - Representative outputs include the ECAM group decision-making model, CAADRIA multi-agent reinforcement learning paper, and AEDM review of collective intelligence in construction.
      - name: Megaproject governance, complexity, risk, and public concerns
        summary: Builds computational evidence for megaproject risk, complexity, stakeholder networks, and dynamic public concerns.
        highlights:
          - Integrates topic modeling, sentiment analysis, social network analysis, multi-criteria decision-making, grey fuzzy group decision-making, Monte Carlo simulation, and bibliometrics.
          - Supports transparent and stakeholder-responsive infrastructure governance through public-opinion evidence, stakeholder evaluation, and complexity measurement.
          - Representative outputs include JCEM public concern dynamics, JAE risk assessment, ECAM complexity measurement, and ECAM stakeholder identification papers.
      - name: Human-centered built-environment evaluation
        summary: Extends architectural programming from buildings to streets, communities, libraries, classrooms, and campus learning environments.
        highlights:
          - Uses street-view imagery, questionnaire data, public reviews, AI perception models, and post-occupancy evaluation.
          - Studies child-friendly communities, urban renewal, higher-education learning environments, and inclusive community planning.
          - Representative outputs include FoAR value-based programming, FoAR neighborhood center public perception analysis, PLOS One child-friendly streets, and learning-environment studies.
      - name: AI-assisted architectural teaching research
        summary: Studies AI as a teaching medium for architectural programming, problem seeking, design generation, evaluation, and design responsibility.
        highlights:
          - Developed and evaluated an AI-assisted architectural programming and design course model published in Buildings.
          - Connects LLM/AIGC workflows with public needs analysis, brief generation, design iteration, and evidence-based studio pedagogy.

